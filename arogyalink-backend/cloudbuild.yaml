steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/arogyalink-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/arogyalink-backend:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/arogyalink-backend:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/arogyalink-backend:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'arogyalink-backend'
      - '--image=gcr.io/$PROJECT_ID/arogyalink-backend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=ENV=production,FIREBASE_PROJECT_ID=solution-challenge-cb95c,FIREBASE_DATABASE_URL=https://solution-challenge-cb95c-default-rtdb.firebaseio.com'

images:
  - 'gcr.io/$PROJECT_ID/arogyalink-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/arogyalink-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
